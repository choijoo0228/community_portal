name: Deploy to Elastic Beanstalk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      APPLICATION_NAME: community-portal
      ENVIRONMENT_NAME: community-portal-env2
      VERSION_LABEL: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create deployment bundle
        run: |
          zip -r app.zip . \
            -x "venv/*" ".git/*" "__pycache__/*" "*.pyc" ".DS_Store" "db.sqlite3" "media/*" "staticfiles/*"

      # Recommended if your AWS account supports GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
          role-session-name: github-actions-eb-deploy

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_region: ${{ env.AWS_REGION }}
          application_name: ${{ env.APPLICATION_NAME }}
          environment_name: ${{ env.ENVIRONMENT_NAME }}
          version_label: ${{ env.VERSION_LABEL }}
          deployment_package: app.zip