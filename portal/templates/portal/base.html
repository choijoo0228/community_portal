<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Community Portal{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="/">Mongolian Community Ireland</a>

    <div class="navbar-nav">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/events/">Events</a>
      <a class="nav-link" href="/resources/">Resources</a>
      {% if user.is_authenticated %}
        <a class="nav-link" href="/suggest-event/">Suggest Event</a>
        <a class="nav-link" href="/my-suggestions/">My Suggestions</a>
        <a class="nav-link" href="/user-section/">User Section</a>
        <a class="nav-link" href="/accounts/logout/">Logout</a>
      {% else %}
        <a class="nav-link" href="/register/">Register</a>
        <a class="nav-link" href="/accounts/login/">Login</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
